[project]
name = "maxpoint"
version = "0.1.0"
description = "MAXPOINT — study assistant + time manager + academic life analyst (personal app)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MAXPOINT" }]
dependencies = [
    "flet>=1.0,<2.0",
    "flet-charts>=1.0,<2.0",
    "flet-secure-storage>=1.0,<2.0",
    "httpx>=0.27",
]

[tool.flet]
product = "MAXPOINT"
org = "com.maxpoint"
bundle_id = "com.maxpoint.app"
build_number = 1

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.INTERNET" = true

[tool.flet.android.feature]
# No special features required in 0.1.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "ui", "services"]
package-dir = { "" = "src" }
